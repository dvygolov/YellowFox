name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  YELLOWFOX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0+git{0}', github.sha) }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            artifact: YellowFox-windows-x64
          - name: linux-x64
            os: ubuntu-22.04
            rid: linux-x64
            artifact: YellowFox-linux-x64
          - name: macos-arm64
            os: macos-14
            rid: osx-arm64
            artifact: YellowFox-macos-arm64
          - name: macos-x64
            os: macos-13
            rid: osx-x64
            artifact: YellowFox-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore YellowFox.sln

      - name: Test
        run: dotnet test YellowFox.sln --configuration Release --no-restore

      - name: Publish desktop
        run: >
          dotnet publish YellowFox.Desktop/YellowFox.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish/app

      - name: Publish CLI
        run: >
          dotnet publish YellowFox.Cli/YellowFox.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish/cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:YELLOWFOX_VERSION.TrimStart('v')
          $stage = "artifacts/package/YellowFox-windows-x64-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Path "artifacts/publish/app/*" -Destination $stage
          Copy-Item -Recurse -Path "artifacts/publish/cli" -Destination "$stage/YellowFox.Cli"
          @"
          YellowFox Windows x64 release.

          Contents:
          - YellowFox.Desktop.exe
          - YellowFox.Cli
          - Python broker scripts copied with the desktop app

          First run requirements:
          - Run setup-python.bat once to install the Python packages and Camoufox.
          "@ | Set-Content -Path "$stage/README-RELEASE.txt" -Encoding UTF8
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/package/YellowFox-windows-x64-$version.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./packaging/make-linux-package.sh artifacts/publish/app artifacts/publish/cli artifacts/package "$YELLOWFOX_VERSION" x64

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/make-macos-app.sh artifacts/publish/app artifacts/publish/cli artifacts/package "$YELLOWFOX_VERSION" "${{ matrix.name == 'macos-arm64' && 'arm64' || 'x64' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/package/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
